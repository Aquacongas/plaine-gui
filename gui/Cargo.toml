[package]
build = "build.rs"
name = "plaine-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Plaine desktop wallet for Windows and Linux."

[dependencies]
eframe = "0.33"
egui = "0.33"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

plaine-wallet = { path = "../wallet" }
plaine-consensus = { path = "../lib/consensus" }

plaine-noded = { path = "../node" }
rfd = "0.15"
directories = "6"
image = "0.25.9"

[build-dependencies]
winresource = "0.1.31"
